<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sushant Maharjan</title>
<style>
  :root {
    --bg: #000000;
    --text: #f5f5f7;
    --text-dim: #86868b;
    --hairline: rgba(255,255,255,0.14);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .stage {
    position: relative;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 24px calc(64px + env(safe-area-inset-bottom, 0px));
    overflow: hidden;
  }

  /* soft ambient glow, Apple-product-page style */
  .glow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1100px;
    height: 1100px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at center,
      rgba(80, 90, 255, 0.16) 0%,
      rgba(180, 90, 255, 0.10) 28%,
      rgba(0,0,0,0) 65%);
    filter: blur(10px);
    pointer-events: none;
    animation: drift 16s ease-in-out infinite;
  }
  @keyframes drift {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -46%) scale(1.06); }
  }

  .eyebrow-role {
    position: relative;
    font-size: clamp(15px, 2vw, 19px);
    letter-spacing: 0.01em;
    color: var(--text-dim);
    margin: 0 0 18px 0;
    font-weight: 400;
    opacity: 0;
    animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 0.05s;
  }

  h1.name {
    position: relative;
    margin: 0;
    font-size: clamp(48px, 9.5vw, 118px);
    line-height: 1.02;
    font-weight: 600;
    letter-spacing: -0.03em;
    background: linear-gradient(180deg, #ffffff 0%, #d7d7dc 55%, #9a9aa2 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    opacity: 0;
    animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 0.18s;
  }

  .roles {
    position: relative;
    margin: 22px 0 44px 0;
    font-size: clamp(17px, 2.4vw, 24px);
    color: var(--text-dim);
    font-weight: 400;
    letter-spacing: -0.005em;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px 14px;
    max-width: 640px;
    opacity: 0;
    animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 0.32s;
  }
  .roles span:not(.dot) { color: var(--text); }
  .dot {
    color: var(--text-dim);
    opacity: 0.5;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .cta {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 15px 34px;
    border-radius: 980px;
    background: var(--text);
    color: #000;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.005em;
    text-decoration: none;
    border: none;
    cursor: pointer;
    overflow: hidden;
    isolation: isolate;
    transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                color 0.35s ease;
    opacity: 0;
    animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 0.46s;
  }
  /* glow that trails the pointer, revealed on hover */
  .cta::before {
    content: "";
    position: absolute;
    inset: -40%;
    background: radial-gradient(circle 90px at var(--mx, 50%) var(--my, 50%),
      rgba(41, 151, 255, 0.9), rgba(120, 90, 255, 0.55) 45%, transparent 72%);
    opacity: 0;
    transition: opacity 0.35s ease;
    z-index: -1;
  }
  /* base fill sits above the glow so text stays legible until hover */
  .cta::after {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--text);
    border-radius: inherit;
    transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: -1;
  }
  .cta:hover {
    color: #fff;
    transform: translateY(-3px) scale(1.045);
    box-shadow: 0 14px 30px rgba(41, 151, 255, 0.25), 0 4px 10px rgba(0,0,0,0.35);
  }
  .cta:hover::before { opacity: 1; }
  .cta:hover::after { opacity: 0.08; }
  .cta:active {
    transform: translateY(-1px) scale(0.97);
    box-shadow: 0 6px 14px rgba(41, 151, 255, 0.2);
  }
  .cta:focus-visible {
    outline: 2px solid #2997ff;
    outline-offset: 3px;
  }
  @media (prefers-reduced-motion: reduce) {
    .cta, .cta::before, .cta::after { transition: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .eyebrow-role, h1.name, .roles, .cta { animation: none; opacity: 1; }
    .glow { animation: none; }
  }
</style>
</head>
<body>

<main class="stage">
  <div class="glow" aria-hidden="true"></div>

  <p class="eyebrow-role">Hello, I'm</p>
  <h1 class="name">Sushant Maharjan</h1>

  <p class="roles">
    <span>Video Editor</span><span class="dot">/</span><span>Motion Designer</span><span class="dot">/</span><span>Graphic Designer</span>
  </p>

  <a class="cta" href="mailto:hello@example.com?subject=Let%27s%20work%20together">Hire Me</a>
</main>

<script>
  (function () {
    var cta = document.querySelector('.cta');
    if (!cta) return;
    cta.addEventListener('pointermove', function (e) {
      var rect = cta.getBoundingClientRect();
      var x = ((e.clientX - rect.left) / rect.width) * 100;
      var y = ((e.clientY - rect.top) / rect.height) * 100;
      cta.style.setProperty('--mx', x + '%');
      cta.style.setProperty('--my', y + '%');
    });
  })();
</script>
</body>
</html>
